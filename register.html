<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praxon Labs // Account Gateway</title>
    <style>
        body {
            background-color: #000000;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal-frame {
            border: 1px solid #00ffff;
            width: 90vw;
            max-width: 1000px;
            height: 85vh;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #00ffff;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .logo-area h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
        .sub-logo {
            font-size: 0.75rem;
            color: #00aaaa;
            margin-top: 5px;
        }
        .header-meta {
            text-align: right;
            font-size: 0.75rem;
            color: #00aaaa;
            line-height: 1.4;
        }
        .alert-box {
            border: 1px solid #00ffff;
            padding: 2px 8px;
            display: inline-block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .body-layout {
            display: flex;
            flex: 1;
            gap: 30px;
        }
        .sidebar {
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-right: 1px solid rgba(0, 255, 255, 0.3);
            padding-right: 15px;
        }
        .nav-link {
            color: #00ffff;
            text-decoration: none;
            padding: 8px 10px;
            font-size: 0.9rem;
            display: block;
        }
        .nav-link:hover, .nav-link.active {
            background-color: #00ffff;
            color: #000000;
            font-weight: bold;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
        }
        .section-title {
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 15px;
            max-width: 400px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: #00aaaa;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            background: #000000;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 5px #00ffff;
        }
        button {
            background: #00ffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #008888;
            color: #ffffff;
        }
        #status {
            margin-top: 15px;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="terminal-frame">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <h1>PRAXON LABS</h1>
                <div class="sub-logo">EST. 5000 BBY // CORE COMPASS: CORULAG</div>
            </div>
            <div class="header-meta">
                <div><span class="alert-box">ALERT</span></div>
                <div>SECURE CONNECTION: HOLONET_E-4</div>
                <div>CLEARANCE: EPSILON-9</div>
            </div>
        </div>

        <!-- Layout Body -->
        <div class="body-layout">
            <!-- Sidebar Navigation -->
            <div class="sidebar">
                <a href="/" class="nav-link">CORE</a>
                <a href="/overview.html" class="nav-link">OVERVIEW</a>
                <a href="/archives.html" class="nav-link">ARCHIVES</a>
                <a href="/projects.html" class="nav-link">PROJECTS</a>
                <a href="/staffing.html" class="nav-link">STAFFING</a>
                <a href="/register.html" class="nav-link active">UPLINK / REG</a>
            </div>

            <!-- Main Content Form -->
            <div class="content-area">
                <h3 class="section-title">[ ACCOUNT INITIALIZATION PROTOCOL ]</h3>
                
                <form id="form">
                    <div class="form-group">
                        <label>// DESIGNATED USERNAME</label>
                        <input type="text" id="user" required autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label>// SECURITY PASSPHRASE</label>
                        <input type="password" id="pass" required>
                    </div>
                    
                    <button type="submit">INITIALIZE CREDENTIALS</button>
                </form>
                
                <div id="status"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.praxonlabs.org/api/register';

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.style.color = '#00aaaa';
            status.innerText = '> Transmitting telemetry data to core...';

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('user').value,
                        password: document.getElementById('pass').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    status.style.color = '#00ffff';
                    status.innerText = `> SUCCESS: ${data.message}`;
                    document.getElementById('form').reset();
                } else {
                    status.style.color = '#ff5555';
                    status.innerText = `> ERROR: ${data.error}`;
                }
            } catch (err) {
                status.style.color = '#ff5555';
                status.innerText = '> ERROR: Uplink connection to backend server failed.';
            }
        });
    </script>
</body>
</html>
